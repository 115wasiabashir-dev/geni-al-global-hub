<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geni AI Purchase</title>
  <link rel="stylesheet" href="css/purchase.css">
</head>
<body>

  <main class="purchase-page">
    <header class="purchase-header">
      <h1>Geni AI</h1>
      <p>Purchase Coins & Currency</p>
    </header>

    <section class="account-section">
      <div>
        <span class="label">Account</span>
        <strong id="user-name">Not signed in</strong>
        <span id="user-email"></span>
      </div>

      <button id="login-button" type="button">
        Continue with Google
      </button>
    </section>

    <section class="balance-section">
      <div class="balance-card">
        <span>Coins</span>
        <strong id="coin-balance">0</strong>
      </div>

      <div class="balance-card">
        <span>Currency</span>
        <strong id="currency-balance">0</strong>
      </div>
    </section>

    <section class="packages-section">
      <h2>Coin Packages</h2>

      <div id="coin-packages" class="packages-grid"></div>

      <h2>Currency Packages</h2>

      <div id="currency-packages" class="packages-grid"></div>
    </section>

    <div id="payment-message" class="payment-message"></div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/store.js"></script>

</body>
</html>
