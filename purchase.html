<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geni AI - Store</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 10px; margin: 0; }
    .header, .user-box { background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .user-box { flex-direction: column; gap: 8px; align-items: stretch; font-size: 13px; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .title { text-align: center; font-size: 14px; font-weight: bold; background: var(--card); border: 1px solid var(--border); padding: 6px; border-radius: 6px; margin-bottom: 8px; }
    .card { background: #fff; color: #0f172a; border-radius: 8px; padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    .right { background: #000; color: #fff; border-radius: 6px; padding: 6px; text-align: center; min-width: 70px; }
    .buy-btn { background: #fff; color: #000; border: none; width: 100%; padding: 4px; border-radius: 4px; font-weight: bold; font-size: 10px; cursor: pointer; margin-top: 4px; }
    /* Payment Overlay Modal */
    #payment-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .modal-box { background: var(--card); border: 1px solid var(--border); width: 90%; max-width: 400px; height: 80%; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: #0f172a; }
    .close-modal-btn { background: #ef4444; color: white; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    #payment-iframe { width: 100%; height: 100%; border: none; background: white; }
  </style>
</head>
<body>

  <div class="header">
    <h1 style="font-size: 16px; margin: 0;">🛒 Store</h1>
    <div id="auth-area">
      <div id="g_id_onload" data-client_id="677647126746-prug504v3o3as4moue8smkprtaptprm4.apps.googleusercontent.com" data-callback="handleLogin" data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-shape="pill" data-size="medium"></div>
    </div>
  </div>

  <div id="user-box" class="user-box hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div><b>Name:</b> <span id="u-name" style="color: #38bdf8;"></span></div>
      <button onclick="handleLogout()" style="background:#ef4444; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:10px; cursor:pointer;">Logout</button>
    </div>
    <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 6px;">
      <div>Coins: <span id="u-coins" style="color: #4ade80; font-weight: bold;">0</span></div>
      <div>Currency: <span id="u-credits" style="color: #facc15; font-weight: bold;">0</span></div>
    </div>
  </div>

  <div class="grid">
    <div>
      <div class="title">Coins</div>
      <div id="coins-container"></div>
    </div>
    <div>
      <div class="title">Currency</div>
      <div id="currency-container"></div>
    </div>
  </div>

  <!-- Payment Overlay Modal with Iframe -->
  <div id="payment-modal" class="hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span style="font-size: 13px; font-weight: bold;">Complete Payment</span>
        <button class="close-modal-btn" onclick="closePaymentModal()">✕ Close</button>
      </div>
      <iframe id="payment-iframe" src=""></iframe>
    </div>
  </div>

  <script>
    const WORKER_URL = 'https://geni-ai-backend.wasiabashir115.workers.dev';
    let currentUser = null;

    const coinPackages = [
      { id: 'coin_50', title: 'Base Pack', main: '50 Coins', total: '50', pkr: 'PKR 280' },
      { id: 'coin_100', title: 'Starter Pack', main: '100 Coins', total: '110', pkr: 'PKR 560' },
      { id: 'coin_300', title: 'Pro Pack', main: '300 Coins', total: '330', pkr: 'PKR 1120' },
      { id: 'coin_800', title: 'Mega Pack', main: '800 Coins', total: '880', pkr: 'PKR 2800' },
      { id: 'coin_1500', title: 'Ultra Pack', main: '1500 Coins', total: '1680', pkr: 'PKR 5040' },
      { id: 'coin_2500', title: 'Max Pack', main: '2500 Coins', total: '2800', pkr: 'PKR 8400' }
    ];

    const currencyPackages = [
      { id: 'currency_250', title: 'Base Pack', main: '250 Credits', total: '250', pkr: 'PKR 280' },
      { id: 'currency_500', title: 'Starter Pack', main: '500 Credits', total: '510', pkr: 'PKR 560' },
      { id: 'currency_1500', title: 'Pro Pack', main: '1500 Credits', total: '1550', pkr: 'PKR 1120' },
      { id: 'currency_4000', title: 'Mega Pack', main: '4000 Credits', total: '4150', pkr: 'PKR 2800' },
      { id: 'currency_7500', title: 'Ultra Pack', main: '7500 Credits', total: '7800', pkr: 'PKR 5040' },
      { id: 'currency_12500', title: 'Max Pack', main: '12500 Credits', total: '13000', pkr: 'PKR 8400' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderPackages();
      const saved = localStorage.getItem('geni_user');
      if (saved) {
        currentUser = JSON.parse(saved);
        showUser(currentUser);
      }
    });

    function renderPackages() {
      const render = (arr) => arr.map(p => `
        <div class="card">
          <div style="max-width: 55%;">
            <div style="font-weight:bold; font-size:12px;">${p.title}</div>
            <div style="font-size:10px; color:#475569;"><b>${p.main}</b><br>Total: ${p.total}</div>
          </div>
          <div class="right">
            <div style="font-size:11px; font-weight:bold; color:#4ade80; margin-bottom:4px;">${p.pkr}</div>
            <button class="buy-btn" onclick="buyPackage('${p.id}')">Buy</button>
          </div>
        </div>
      `).join('');

      document.getElementById('coins-container').innerHTML = render(coinPackages);
      document.getElementById('currency-container').innerHTML = render(currencyPackages);
    }

    function parseJwt(token) {
      try {
        const base64 = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        return JSON.parse(decodeURIComponent(atob(base64).split('').map(c => '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
      } catch (e) { return null; }
    }

    function handleLogin(res) {
      const data = parseJwt(res.credential);
      if (data) {
        currentUser = { user_id: data.sub, name: data.name, email: data.email, coins: 0, currency_balance: 0 };
        localStorage.setItem('geni_user', JSON.stringify(currentUser));
        showUser(currentUser);
      }
    }

    function handleLogout() {
      localStorage.clear();
      if (typeof google !== 'undefined') google.accounts.id.disableAutoSelect();
      window.location.replace(window.location.pathname);
    }

    function showUser(u) {
      document.getElementById('auth-area').classList.add('hidden');
      document.getElementById('user-box').classList.remove('hidden');
      document.getElementById('u-name').innerText = u.name;
      document.getElementById('u-coins').innerText = u.coins ?? 0;
      document.getElementById('u-credits').innerText = u.currency_balance ?? 0;
    }

    async function buyPackage(packageId) {
      if (!currentUser) {
        alert('Please log in first.');
        return;
      }
      try {
        const res = await fetch(`${WORKER_URL}/create-checkout`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: currentUser.user_id, packageId, currency: 'PKR' })
        });
        const data = await res.json();
        if (data.success && data.checkout_url) {
          // Open inside iframe overlay instead of window.location.href
          document.getElementById('payment-iframe').src = data.checkout_url;
          document.getElementById('payment-modal').classList.remove('hidden');
        } else {
          alert(data.message || 'Failed to create checkout.');
        }
      } catch (e) {
        alert('Connection error.');
      }
    }

    function closePaymentModal() {
      document.getElementById('payment-modal').classList.add('hidden');
      document.getElementById('payment-iframe').src = '';
    }
  </script>
</body>
</html>
